services:
  - type: web
    name: kiapat-backend
    env: python
    buildCommand: |
      pip install -r server/requirements.txt
    startCommand: |
      uvicorn server.app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        value: ${DATABASE_URL}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: CORS_ALLOWED_ORIGINS
        value: ${CORS_ALLOWED_ORIGINS}
      - key: SEED_TOKEN
        value: ${SEED_TOKEN}
      - key: TZ
        value: Asia/Manila